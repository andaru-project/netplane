<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andaru Netplane — UI Design Prototype</title>
  <style>
/* Andaru Netplane — Design Prototype Styles
 * Visual language matched to andaru-project/andaru (Mantine v9, primaryColor: teal,
 * defaultRadius: sm, system-ui sans + monospace, #ffb21c brand mark accent).
 */

:root {
  color-scheme: light dark;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

  --radius-xs: 3px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  --header-h: 56px;
  --sidebar-w: 240px;

  /* Andaru brand mark accent (never used as body text on white) */
  --brand-amber: #ffb21c;
  --brand-ink-on-amber: #17212c;

  /* VLAN semantic hues (distinct & color-blind tuned with glyph/pattern pairs) */
  --vlan-10: #0ca678; /* LAN - Teal */
  --vlan-20: #e8590c; /* IoT - Orange */
  --vlan-30: #7048e8; /* Guest - Violet */
  --vlan-40: #1c7ed6; /* Lab - Blue */
  --vlan-99: #5c7cfa; /* Mgmt - Indigo */
}

[data-theme="light"] {
  --bg-canvas: #f8f9fa;      /* Mantine gray-0 */
  --bg-surface: #ffffff;
  --bg-subtle: #f1f3f5;      /* Mantine gray-1 */
  --bg-hover: #e9ecef;       /* Mantine gray-2 */
  --bg-canvas-svg: #fbfcfd;
  --bg-bezel: #1b222c;       /* Hardware rack bezel stays dark metallic */
  --bg-bezel-port: #26303d;
  --bg-bezel-fiber: #142842;

  --border: #dee2e6;         /* Mantine gray-3 */
  --border-subtle: #e9ecef;
  --border-strong: #ced4da;

  --text: #17212c;           /* Andaru dark ink */
  --text-secondary: #3f4d5c;
  --text-dimmed: #526171;    /* 6.35:1 on white per Andaru web-ui-foundation.md */

  --primary: #0ca678;        /* Mantine teal-7 */
  --primary-hover: #099268;  /* Mantine teal-8 */
  --primary-soft: rgba(12, 166, 120, 0.11);
  --primary-text: #087f5b;

  --green: #2b8a3e;
  --green-soft: rgba(43, 138, 62, 0.11);
  --blue: #1971c2;
  --blue-soft: rgba(25, 113, 194, 0.11);
  --cyan: #0c8599;
  --cyan-soft: rgba(12, 133, 153, 0.11);
  --amber: #b36b00;
  --amber-bright: #e67700;
  --amber-soft: rgba(230, 119, 0, 0.12);
  --red: #c92a2a;
  --red-soft: rgba(201, 42, 42, 0.11);
  --gray-badge: #495057;
  --gray-soft: rgba(73, 80, 87, 0.11);

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);
}

[data-theme="dark"] {
  --bg-canvas: #141517;      /* Mantine dark-8 */
  --bg-surface: #1a1b1e;     /* Mantine dark-7 */
  --bg-subtle: #25262b;      /* Mantine dark-6 */
  --bg-hover: #2c2e33;       /* Mantine dark-5 */
  --bg-canvas-svg: #121417;
  --bg-bezel: #0f1318;
  --bg-bezel-port: #1e2530;
  --bg-bezel-fiber: #112238;

  --border: #2c2e33;         /* Mantine dark-5 */
  --border-subtle: #25262b;
  --border-strong: #373a40;  /* Mantine dark-4 */

  --text: #e9ecef;
  --text-secondary: #c1c2c5;
  --text-dimmed: #909296;    /* Mantine dark-2 */

  --primary: #20c997;        /* Mantine teal-5 */
  --primary-hover: #38d9a9;
  --primary-soft: rgba(32, 201, 151, 0.15);
  --primary-text: #38d9a9;

  --green: #40c057;
  --green-soft: rgba(64, 192, 87, 0.16);
  --blue: #4dabf7;
  --blue-soft: rgba(77, 171, 247, 0.16);
  --cyan: #22b8cf;
  --cyan-soft: rgba(34, 184, 207, 0.16);
  --amber: #fab005;
  --amber-bright: #ff922b;
  --amber-soft: rgba(250, 176, 5, 0.16);
  --red: #ff6b6b;
  --red-soft: rgba(255, 107, 107, 0.16);
  --gray-badge: #adb5bd;
  --gray-soft: rgba(173, 181, 189, 0.14);

  --vlan-10: #20c997;
  --vlan-20: #ff922b;
  --vlan-30: #9775fa;
  --vlan-40: #4dabf7;
  --vlan-99: #748ffc;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-width: 320px;
  min-height: 100%;
  background: var(--bg-canvas);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

a {
  color: var(--primary-text);
  text-decoration: none;
}
a:hover { text-decoration: underline; }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.mono {
  font-family: var(--font-mono);
  font-size: 12.5px;
}

.dimmed { color: var(--text-dimmed); }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.text-xs { font-size: 12px; }
.text-sm { font-size: 13px; }
.nowrap { white-space: nowrap; }

/* ================= Shell Layout (mirrors Andaru Shell.tsx) ================= */

.app-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 40;
  gap: 12px;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-link {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
}
.brand-link:hover { text-decoration: none; }
.brand-sub {
  font-weight: 500;
  color: var(--text-dimmed);
  font-size: 13px;
}

.burger-btn {
  display: none;
  width: 34px;
  height: 34px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.burger-btn:hover { background: var(--bg-subtle); }

.app-sidebar {
  position: fixed;
  top: var(--header-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  padding: 14px 10px;
  overflow-y: auto;
  z-index: 35;
  display: flex;
  flex-direction: column;
  gap: 18px;
  transition: transform 0.18s ease;
}

.nav-group-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dimmed);
  padding: 0 10px 6px;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  transition: background 0.12s ease, color 0.12s ease;
}
.nav-item:hover {
  background: var(--bg-subtle);
  color: var(--text);
}
.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary-text);
  font-weight: 600;
}
.nav-item-left {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.85;
}

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-dimmed);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-backdrop {
  display: none;
  position: fixed;
  inset: var(--header-h) 0 0 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 30;
}

.app-main {
  margin-top: var(--header-h);
  margin-left: var(--sidebar-w);
  padding: 20px 24px 36px;
  max-width: 1480px;
}

/* ================= Components (Mantine-aligned) ================= */

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.page-title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.page-subtitle {
  margin: 3px 0 0;
  color: var(--text-dimmed);
  font-size: 13.5px;
}
.page-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.card-pad { padding: 16px; }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}
.card-title {
  margin: 0;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.card-body { padding: 16px; }

.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}
.grid-2-asym {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.grid-canvas-side {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 16px;
  align-items: start;
}
.grid-2 > *, .grid-2-asym > *, .grid-canvas-side > * { min-width: 0; }
.alert-row-desc { overflow-wrap: anywhere; }

/* KPI cards */
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 13px 15px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  width: 100%;
}
.kpi-card.clickable {
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.kpi-card.clickable:hover {
  border-color: var(--primary);
  background: var(--bg-subtle);
}
.kpi-label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dimmed);
}
.kpi-value {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.kpi-meta {
  font-size: 12px;
  color: var(--text-dimmed);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.btn:hover { background: var(--bg-subtle); }
.btn-xs { height: 26px; padding: 0 9px; font-size: 12px; }
.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
[data-theme="dark"] .btn-primary { color: #0e1412; font-weight: 600; }
.btn-subtle {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}
.btn-subtle:hover { background: var(--bg-subtle); color: var(--text); }
.btn-active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary-text);
  font-weight: 600;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-teal { background: var(--primary-soft); color: var(--primary-text); }
.badge-blue { background: var(--blue-soft); color: var(--blue); }
.badge-cyan { background: var(--cyan-soft); color: var(--cyan); }
.badge-amber { background: var(--amber-soft); color: var(--amber); }
.badge-red { background: var(--red-soft); color: var(--red); }
.badge-gray { background: var(--gray-soft); color: var(--gray-badge); }
.badge-outline {
  background: transparent;
  border-color: var(--border-strong);
  color: var(--text-secondary);
}
.badge-dot::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}
.badge-solid-amber {
  background: var(--brand-amber);
  color: var(--brand-ink-on-amber);
}

/* Inputs & Selects */
.input, .select {
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  color: var(--text);
  font-size: 13px;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-soft);
}

/* Segmented control */
.segmented {
  display: inline-flex;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  gap: 2px;
}
.segmented button {
  border: none;
  background: transparent;
  padding: 4px 10px;
  border-radius: 3px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-dimmed);
  cursor: pointer;
}
.segmented button.active {
  background: var(--bg-surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Tables (Andaru-style compact striped tables with horizontal scroll) */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data-table th {
  text-align: left;
  padding: 9px 12px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dimmed);
  border-bottom: 1px solid var(--border);
  background: var(--bg-subtle);
  white-space: nowrap;
}
table.data-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}
table.data-table tbody tr:nth-child(even) {
  background: rgba(128, 128, 128, 0.025);
}
table.data-table tbody tr.clickable {
  cursor: pointer;
}
table.data-table tbody tr.clickable:hover {
  background: var(--primary-soft);
}
table.data-table tbody tr:last-child td {
  border-bottom: none;
}

/* Alert rows */
.alert-list {
  display: flex;
  flex-direction: column;
}
.alert-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border-subtle);
  border-left: 3px solid transparent;
}
.alert-row:last-child { border-bottom: none; }
.alert-row.crit { border-left-color: var(--red); }
.alert-row.warn { border-left-color: var(--amber-bright); }
.alert-row-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.alert-row-title {
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.alert-row-desc {
  font-size: 12.5px;
  color: var(--text-dimmed);
}

/* Inline callout box */
.callout {
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  background: var(--bg-subtle);
  font-size: 13px;
}
.callout.crit {
  border-left-color: var(--red);
  background: var(--red-soft);
}
.callout.warn {
  border-left-color: var(--amber-bright);
  background: var(--amber-soft);
}

/* Progress / Meter bars */
.meter {
  height: 7px;
  background: var(--bg-subtle);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}
.meter-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--primary);
}
.meter-fill.warn { background: var(--amber-bright); }
.meter-fill.crit { background: var(--red); }

/* ================= Hardware Port Faceplate ================= */

.faceplate-bezel {
  background: var(--bg-bezel);
  border: 1px solid #303a47;
  border-radius: var(--radius-md);
  padding: 16px;
  color: #e9ecef;
  overflow-x: auto;
}
.faceplate-top-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  font-size: 11.5px;
  color: #9aa5b1;
  font-family: var(--font-mono);
  flex-wrap: wrap;
}
.faceplate-ports-strip {
  display: flex;
  align-items: stretch;
  gap: 12px;
  flex-wrap: wrap;
}
.faceplate-bank {
  display: flex;
  align-items: stretch;
  gap: 6px;
  flex-wrap: wrap;
}
.faceplate-divider {
  width: 1px;
  background: #364152;
  margin: 2px 4px;
}
.lag-bracket {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border: 1px dashed #38bdf8;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.06);
}
.lag-bracket-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: #7dd3fc;
  text-align: center;
  letter-spacing: 0.04em;
}
.lag-bracket-ports {
  display: flex;
  gap: 6px;
}

.port-tile {
  position: relative;
  min-width: 72px;
  padding: 8px 6px 7px;
  border-radius: 5px;
  background: var(--bg-bezel-port);
  border: 2px solid #475569;
  color: #f8fafc;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: transform 0.1s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}
.port-tile:hover { transform: translateY(-1px); border-color: #94a3b8; }
.port-tile.fiber { background: var(--bg-bezel-fiber); }
.port-tile.up { border-color: #2f9e44; }
.port-tile.up.fiber { border-color: #22b8cf; }
.port-tile.stp-block { border-color: #f59f00; }
.port-tile.down { border-color: #3f4854; opacity: 0.72; }
.port-tile.disabled { border-color: #3f4854; border-style: dashed; opacity: 0.55; }
.port-tile.selected {
  border-color: var(--brand-amber) !important;
  box-shadow: 0 0 0 2px rgba(255, 178, 28, 0.35);
  opacity: 1;
}
.port-tile.vlan-dim { opacity: 0.34; }
.port-tile.vlan-match { opacity: 1; box-shadow: 0 0 0 2px rgba(32, 201, 151, 0.4); }

.port-jack {
  width: 28px;
  height: 18px;
  border-radius: 2px;
  border: 1.5px solid rgba(255,255,255,0.22);
  background: #0d1117;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 2px;
  gap: 2px;
}
.port-jack.fiber-cage {
  width: 32px;
  border-color: rgba(56, 189, 248, 0.45);
  background: #091321;
}
.port-led {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #475569;
}
.port-tile.up .port-led { background: #40c057; box-shadow: 0 0 5px #40c057; }

.port-tags-row {

  justify-content: center;
  flex-wrap: wrap;

.port-mini-anom { background: #e03131; color: #ffffff; }
.port-mini-t { background: #0ca678; color: #ffffff; }
.port-mini-u { background: transparent; border: 1px solid #38d9a9; color: #63e6be; }

.vlan-pill-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.vlan-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.vlan-pill:hover { background: var(--bg-subtle); }
.vlan-pill.active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary-text);
}
.vlan-swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
  flex-shrink: 0;
}

.svg-stage {
  background: var(--bg-canvas-svg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: relative;
}
.svg-stage svg {
  display: block;
}

.legend-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 9px 14px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  font-size: 12px;
  color: var(--text-dimmed);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Matrix table */
.matrix-cell {
  text-align: center !important;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  min-width: 66px;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 21px;
  padding: 0 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}
.tag-chip.t {
  background: var(--primary-soft);
  color: var(--primary-text);
  border: 1px solid var(--primary);
}
.tag-chip.u {
  background: var(--bg-subtle);
  color: var(--text);
  border: 1.5px dashed var(--text-secondary);
}
.tag-chip.anom-leak {
  background: var(--red-soft);
  color: var(--red);
  border: 1.5px solid var(--red);
  cursor: pointer;
}
.tag-chip.anom-dead {
  background: var(--amber-soft);
  color: var(--amber);
  border: 1.5px dashed var(--amber-bright);
  cursor: pointer;
}

/* Inspector key-value grid */
.kv-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 14px;
}
.kv-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.kv-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kv-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dimmed);
}
.kv-val {
  font-size: 13px;
  font-weight: 500;
}

/* Diff comparison box inside VLAN Flow inspector */
.port-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}
.port-compare-side {
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-subtle);
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: var(--bg-surface);
  color: var(--text);
  border: 1px solid var(--primary);
  border-left: 4px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  box-shadow: var(--shadow-md);
  z-index: 60;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ================= Responsive Breakpoints ================= */

@media (max-width: 1120px) {

      if_name: ifName,
      device_id: devId

              edge_id: edge.id,
              vlans: [s.vlan_id],
              title: `VLAN ${s.vlan_id} (${v.name}) Dead-End on wireless uplink to ${apDev.name}`,
              short_label: `DEAD-END · Not on mesh uplink`,
              from_device_id: peerDev.id,
              from_link: 'mesh-5g',
              from_cfg: { pvid: wu.pvid, tagged: wu.tagged_vlans },
              to_device_id: apDev.id,
              to_link: 'uplink-5g',
              to_cfg: { pvid: wu.pvid, tagged: wu.tagged_vlans },
              summary: `${apDev.name} broadcasts SSID "${s.name}" mapped to VLAN ${s.vlan_id} (${v.name}), but wireless uplink from ${peerDev.name} only carries [U:${wu.pvid}, T:${wu.tagged_vlans.join(',')}].`,
              consequence: `Clients associating to "${s.name}" on ${apDev.name} receive no DHCP replies and have no path to zone "${v.zone}" (${v.gateway}).`,
              affected: [`SSID "${s.name}" on ${apDev.name} (5GHz ch 36)`],
              remediation: `Include VLAN ${s.vlan_id} (${v.name}) in the mesh uplink VLAN trunk between ${peerDev.name} and ${apDev.name}, or disable "${s.name}" on ${apDev.name}.`
            });
          }
        });
      });
    });

    anomalies.sort((a, b) => (a.severity === 'crit' ? 0 : 1) - (b.severity === 'crit' ? 0 : 1));
    return anomalies;
  }

  function formatSpeed(mbps) {
    if (!mbps) return '—';
    if (mbps >= 1000) {
      const g = mbps / 1000;
      return `${Number.isInteger(g) ? g : g.toFixed(1)}G`;
    }
    return `${mbps}M`;
  }

  function formatBps(bps) {
    if (!bps || bps <= 0) return '0 bps';
    if (bps >= 1e9) return `${(bps / 1e9).toFixed(2)} Gbps`;
    if (bps >= 1e6) return `${(bps / 1e6).toFixed(1)} Mbps`;
    if (bps >= 1e3) return `${(bps / 1e3).toFixed(0)} kbps`;
    return `${Math.round(bps)} bps`;
  }

  function formatUptime(sec) {
    if (!sec) return '—';
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return d > 0 ? `${d}d ${h}h` : `${h}h ${m}m`;
  }

  function formatBytes(b) {
    if (!b) return '0 B';
    if (b >= 1e12) return `${(b / 1e12).toFixed(2)} TB`;
    if (b >= 1e9) return `${(b / 1e9).toFixed(1)} GB`;
    if (b >= 1e6) return `${(b / 1e6).toFixed(1)} MB`;
    return `${(b / 1e3).toFixed(0)} KB`;
  }

  function getVlanColor(vid) {
    const v = getVlan(vid);
    if (!v) return '#868e96';
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return isDark ? v.hexDark : v.hexLight;
  }

  function findPeerForLink(deviceId, ifName) {
    const link = getLink(deviceId, ifName);
    const matchName = link && link.lag_group_id ? link.lag_group_id : ifName;
    for (const e of INFRA_EDGES) {
      if (e.from_id === deviceId && (e.from_link === ifName || e.from_link === matchName)) {
        return { edge: e, peerDevice: getDevice(e.to_id), peerLink: e.to_link };
      }
      if (e.to_id === deviceId && (e.to_link === ifName || e.to_link === matchName)) {
        return { edge: e, peerDevice: getDevice(e.from_id), peerLink: e.from_link };
      }
    }
    return null;
  }

  global.NETPLANE_DATA = {
    VLANS,
    DEVICES,
    LAG_GROUPS,
    LINKS,
    SEGMENTS,
    ZONES,
    GATEWAYS,
    FIREWALLS,
    RADIOS,
    WIRELESS_UPLINKS,
    CLIENTS,
    INFRA_EDGES,
    EVENTS,
    anomalies: analyzeVlanFlow(),
    getDevice,
    getVlan,
    getLink,
    getEdgePortConfig,
    portModeForVlan,
    findPeerForLink,
    getVlanColor,
    formatSpeed,
    formatBps,
    formatUptime,
    formatBytes
  };
})(window);

  <script>
/* === topology.js === */
/* Andaru Netplane — Interactive L2/L3/Wi-Fi Topology View */
(function (global) {
  'use strict';

  const D = global.NETPLANE_DATA;

  const state = {
    vlanOverlay: 'none',
    showClients: false,
    showEvidence: true,
    selectedType: 'device', // 'device' | 'edge'
    selectedId: 'openwrt:sw-core'
  };

  function roleIconPath(role) {
    switch (role) {
      case 'firewall':
        return '<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>';
      case 'switch':
        return '<rect x="3" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 12h2M11 12h2M15 12h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
      case 'ap':
        return '<circle cx="12" cy="14" r="2" fill="currentColor"/><path d="M8.5 11.5a5 5 0 017 0M5.5 8.5a9.2 9.2 0 0113 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
      default:
        return '<rect x="4" y="5" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 19h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
    }
  }

  function edgeVlanStatus(edge, vid) {
    if (edge.stp_blocked) return { status: 'stp', label: 'STP BLK' };
    const fromCfg = D.getEdgePortConfig(edge, 'from');
    const toCfg = D.getEdgePortConfig(edge, 'to');
    const anom = D.anomalies.find((a) => a.edge_id === edge.id && a.vlans.includes(vid));
    if (anom) {
      return { status: anom.kind === 'leak' ? 'leak' : 'dead_end', label: anom.kind === 'leak' ? 'LEAK' : 'DEAD-END', anomaly: anom };
    }
    const mFrom = D.portModeForVlan(fromCfg, vid);
    const mTo = D.portModeForVlan(toCfg, vid);
    if (mFrom !== 'none' && mTo !== 'none') {
      return { status: 'pass', label: mFrom === 'U' && mTo === 'U' ? 'U' : 'T' };
    }
    return { status: 'unused', label: '' };
  }

  function renderSvg() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const colors = {
      surface: isDark ? '#1a1b1e' : '#ffffff',
      subtle: isDark ? '#25262b' : '#f1f3f5',
      border: isDark ? '#373a40' : '#ced4da',
      text: isDark ? '#e9ecef' : '#17212c',
      dim: isDark ? '#909296' : '#526171',
      teal: isDark ? '#20c997' : '#0ca678',
      blue: isDark ? '#4dabf7' : '#1971c2',
      violet: isDark ? '#9775fa' : '#7048e8',
      amber: isDark ? '#fab005' : '#e67700',
      red: isDark ? '#ff6b6b' : '#c92a2a',
      green: isDark ? '#40c057' : '#2b8a3e',
      gray: isDark ? '#5c5f66' : '#adb5bd'
    };

    // Deterministic hierarchical positions (fits cleanly in 820px viewBox)
    const pos = {
      'andaru:fw-core':           { x: 312, y: 26 },
      'openwrt:sw-core':          { x: 312, y: 162 },
      'rtlplayground:sw-office':  { x: 34,  y: 322 },
      'unifi:sw-media':           { x: 312, y: 322 },
      'unifi:ap-hallway':         { x: 590, y: 322 },
      'unifi:ap-garage':          { x: 590, y: 466 }
    };

    const nodeW = 196;
    const nodeH = 66;
    const svgW = 820;
    const svgH = state.showClients ? 640 : 562;

    let edgesSvg = '';
    let labelsSvg = '';

    D.INFRA_EDGES.forEach((e) => {
      const p1 = pos[e.from_id];
      const p2 = pos[e.to_id];
      if (!p1 || !p2) return;

      const isSelected = state.selectedType === 'edge' && state.selectedId === e.id;
      const x1 = p1.x + nodeW / 2;
      const y1 = p1.y + nodeH;
      const x2 = p2.x + nodeW / 2;
      const y2 = p2.y;

      // Offset redundant STP edge cleanly to the upper-left so labels never collide
      let pathD;
      let midX, midY;
      if (e.stp_blocked) {
        pathD = `M ${p1.x} ${p1.y + nodeH * 0.55} C ${p1.x - 160} ${p1.y + 42}, ${p2.x + 28} ${p2.y - 84}, ${p2.x + 48} ${p2.y}`;
        midX = p2.x + 76;
        midY = p1.y + 72;
      } else {
        const dy = Math.max(38, (y2 - y1) * 0.45);
        pathD = `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
        midX = (x1 + x2) / 2;
        midY = (y1 + y2) / 2;
        // Stagger the 3 fan-out trunk labels from sw-core vertically so they never collide
        if (e.id === 'e-core-office') { midX -= 22; midY += 16; }
        if (e.id === 'e-core-media')  { midY -= 4; }
        if (e.id === 'e-core-hallway'){ midX += 22; midY += 16; }
      }

      let stroke = e.kind === 'lag' ? colors.blue : e.kind === 'wireless_uplink' ? colors.violet : colors.teal;
      let strokeW = e.kind === 'lag' ? 4 : 2.2;
      let dash = e.kind === 'wireless_uplink' ? '6,4' : '';
      let opacity = 1;
      let overlayBadge = '';

      if (e.stp_blocked) {
        stroke = colors.gray;
        strokeW = 1.6;
        dash = '4,4';
        opacity = 0.78;
      }

      if (state.vlanOverlay !== 'none') {
        const vid = Number(state.vlanOverlay);
        const st = edgeVlanStatus(e, vid);
        if (st.status === 'pass') {
          stroke = colors.green;
          strokeW = e.kind === 'lag' ? 4.5 : 3;
          overlayBadge = `✓ ${st.label}`;
        } else if (st.status === 'leak') {
          stroke = colors.red;
          strokeW = 3.5;
          overlayBadge = '⚠ LEAK';
        } else if (st.status === 'dead_end') {
          stroke = colors.amber;
          strokeW = 3;
          dash = '6,4';
          overlayBadge = '⊘ BLOCKED';
        } else if (st.status === 'stp') {
          stroke = colors.gray;
          opacity = 0.45;
        } else {
          stroke = colors.gray;
          opacity = 0.28;
        }
      }

      const selRing = isSelected
        ? `<path d="${pathD}" fill="none" stroke="#ffb21c" stroke-width="${strokeW + 5}" stroke-opacity="0.45" />`
        : '';

      // Twin-rail effect for LAG
      let lagInner = '';
      if (e.kind === 'lag') {
        lagInner = `<path d="${pathD}" fill="none" stroke="${colors.surface}" stroke-width="1.4" />`;
      }

      edgesSvg += `
        <g class="topo-edge" data-edge-id="${e.id}" style="cursor:pointer;opacity:${opacity}">
          <path d="${pathD}" fill="none" stroke="transparent" stroke-width="16" />
          ${selRing}
          <path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${strokeW}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linecap="round" />
          ${lagInner}
        </g>`;

      // Compact caption pill at midpoint
      const mainCap = e.stp_blocked
        ? 'STP BLK · 1G'
        : e.kind === 'lag'
          ? `LAG bond0 · ${D.formatSpeed(e.speed_mbps)}`
          : e.kind === 'wireless_uplink'
            ? `Wi-Fi 5G · ${e.signal_dbm}dBm`
            : `${e.from_link}↔${e.to_link} · ${D.formatSpeed(e.speed_mbps)}`;

      const evTag = state.showEvidence && !e.stp_blocked
        ? (e.evidence === 'wireless_uplink' ? ' · MESH' : ` · ${e.evidence.toUpperCase()}`)
        : '';
      const pillText = overlayBadge ? `${overlayBadge} · ${mainCap}` : `${mainCap}${evTag}`;

      const pillW = Math.max(88, pillText.length * 5.9 + 14);
      const pillBg = overlayBadge.startsWith('⚠')
        ? colors.red
        : overlayBadge.startsWith('⊘')
          ? colors.amber
          : colors.surface;
      const pillFg = overlayBadge.startsWith('⚠')
        ? '#ffffff'
        : overlayBadge.startsWith('⊘')
          ? '#17212c'
          : colors.dim;
      const pillBorder = isSelected ? '#ffb21c' : overlayBadge ? pillBg : colors.border;

      labelsSvg += `
        <g class="topo-edge" data-edge-id="${e.id}" style="cursor:pointer;opacity:${opacity === 0.28 ? 0.45 : 1}">
          <rect x="${midX - pillW / 2}" y="${midY - 10}" width="${pillW}" height="20" rx="4" fill="${pillBg}" stroke="${pillBorder}" stroke-width="${isSelected ? 1.8 : 1}" />
          <text x="${midX}" y="${midY + 3.5}" text-anchor="middle" fill="${pillFg}" font-size="10" font-weight="600" font-family="ui-monospace, monospace">${pillText}</text>
        </g>`;
    });

    // Optional Client group pills when Show Clients is enabled
    let clientsSvg = '';
    if (state.showClients) {
      const clientGroups = [
        { devId: 'openwrt:sw-core', x: 34, y: 170, label: '3 Wired Servers', sub: 'nas-truenas, proxmox-01, ha-green' },
        { devId: 'rtlplayground:sw-office', x: 34, y: 466, label: '6 Office Wired', sub: '2 Lab DUTs stranded (V40)' },
        { devId: 'unifi:sw-media', x: 312, y: 466, label: '6 Living Room Wired', sub: '3 PoE cams/VoIP + 3 media' },
        { devId: 'unifi:ap-hallway', x: 312, y: 564, label: '4 Hallway Wi-Fi', sub: 'LAN, IoT, Guest' },
        { devId: 'unifi:ap-garage', x: 590, y: 566, label: '3 Garage Clients', sub: 'ev-charger + 2 Wi-Fi' }
      ];
      clientGroups.forEach((cg) => {
        const dp = pos[cg.devId];
        if (!dp) return;
        const x1 = dp.x + nodeW / 2;
        const y1 = dp.y + nodeH;
        const x2 = cg.x + nodeW / 2;
        const y2 = cg.y;
        const fromX = cg.devId === 'openwrt:sw-core' ? dp.x : x1;
        const fromY = cg.devId === 'openwrt:sw-core' ? dp.y + nodeH / 2 : y1;
        const toX = cg.devId === 'openwrt:sw-core' ? cg.x + nodeW : x2;
        const toY = cg.devId === 'openwrt:sw-core' ? cg.y + 24 : y2;

        clientsSvg += `
          <line x1="${fromX}" y1="${fromY}" x2="${toX}" y2="${toY}" stroke="${colors.gray}" stroke-width="1.3" stroke-dasharray="3,3" />
          <g transform="translate(${cg.x}, ${cg.y})">
            <rect width="${nodeW}" height="48" rx="6" fill="${colors.subtle}" stroke="${colors.border}" stroke-dasharray="4,2" />
            <text x="12" y="20" fill="${colors.text}" font-size="11.5" font-weight="600" font-family="system-ui, sans-serif">${cg.label}</text>
            <text x="12" y="36" fill="${colors.dim}" font-size="10" font-family="ui-monospace, monospace">${cg.sub.slice(0, 27)}</text>
          </g>`;
      });
    }

    // Device Nodes
    let nodesSvg = '';
    D.DEVICES.forEach((dev) => {
      const p = pos[dev.id];
      if (!p) return;
      const isSel = state.selectedType === 'device' && state.selectedId === dev.id;
      const devLinks = D.LINKS.filter((l) => l.device_id === dev.id);
      const upCount = devLinks.filter((l) => l.link_up).length;
      const hasLeak = D.anomalies.some((a) => a.kind === 'leak' && (a.from_device_id === dev.id || a.to_device_id === dev.id));
      const hasDead = D.anomalies.some((a) => a.kind === 'dead_end' && (a.from_device_id === dev.id || a.to_device_id === dev.id));
      const hasSfpWarn = devLinks.some((l) => l.sfp && l.sfp.alert_state !== 'ok');

      const accent = dev.role === 'firewall' ? '#ffb21c' : dev.role === 'ap' ? colors.violet : colors.teal;
      const stroke = isSel ? '#ffb21c' : hasLeak ? colors.red : colors.border;
      const strokeW = isSel ? 2.5 : hasLeak ? 1.8 : 1.2;

      let alertDot = '';
      if (hasLeak) {
        alertDot = `<g transform="translate(${nodeW - 22}, 10)"><circle cx="6" cy="6" r="6" fill="${colors.red}" /><text x="6" y="9.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">!</text></g>`;
      } else if (hasDead || hasSfpWarn) {
        alertDot = `<g transform="translate(${nodeW - 22}, 10)"><circle cx="6" cy="6" r="6" fill="${colors.amber}" /><text x="6" y="9.5" text-anchor="middle" fill="#17212c" font-size="9" font-weight="700">!</text></g>`;
      }

      nodesSvg += `
        <g class="topo-node" data-device-id="${dev.id}" transform="translate(${p.x}, ${p.y})" style="cursor:pointer" role="button" tabindex="0" aria-label="Select ${dev.name}">
          <rect width="${nodeW}" height="${nodeH}" rx="6" fill="${colors.surface}" stroke="${stroke}" stroke-width="${strokeW}" />
          <rect width="5" height="${nodeH}" rx="2" fill="${accent}" />
          <g transform="translate(14, 12)" style="color:${accent}">
            <svg width="20" height="20" viewBox="0 0 24 24">${roleIconPath(dev.role)}</svg>
          </g>
          <text x="40" y="25" fill="${colors.text}" font-size="13" font-weight="700" font-family="system-ui, sans-serif">${dev.name}</text>
          <text x="40" y="40" fill="${colors.dim}" font-size="10" font-family="ui-monospace, monospace">${dev.driver} · ${dev.mgmt_ip}</text>
          <text x="14" y="56" fill="${colors.dim}" font-size="9.5" font-family="ui-monospace, monospace">${dev.role.toUpperCase()} · ${upCount}/${devLinks.length} up${dev.poe_budget ? ` · ${dev.poe_budget.used_watts}W` : ''}</text>
          ${alertDot}
        </g>`;
    });

    return `
      <svg style="width:100%;min-width:640px;height:auto" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="Network physical and logical topology graph">
        ${edgesSvg}
        ${clientsSvg}
        ${nodesSvg}
        ${labelsSvg}
      </svg>`;
  }

  function renderInspector() {
    if (state.selectedType === 'edge') {
      const edge = D.INFRA_EDGES.find((e) => e.id === state.selectedId);
      if (!edge) return '';
      const fromDev = D.getDevice(edge.from_id);
      const toDev = D.getDevice(edge.to_id);
      const fromCfg = D.getEdgePortConfig(edge, 'from');
      const toCfg = D.getEdgePortConfig(edge, 'to');
      const edgeAnoms = D.anomalies.filter((a) => a.edge_id === edge.id);

      return `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Link Inspector</h3>
            <span class="badge ${edge.stp_blocked ? 'badge-gray' : edge.kind === 'lag' ? 'badge-blue' : edge.kind === 'wireless_uplink' ? 'badge-cyan' : 'badge-teal'}">
              ${edge.stp_blocked ? 'STP Blocked' : edge.kind.replace('_', ' ')}
            </span>
          </div>
          <div class="card-body stack-sm">
            <div class="fw-700">${fromDev.name} <span class="dimmed">↔</span> ${toDev.name}</div>
            <div class="kv-grid">
              <div class="kv-item"><span class="kv-label">Speed</span><span class="kv-val mono">${D.formatSpeed(edge.speed_mbps)}${edge.signal_dbm ? ` (${edge.signal_dbm} dBm)` : ''}</span></div>
              <div class="kv-item"><span class="kv-label">Evidence</span><span class="kv-val mono">${edge.evidence} (${Math.round(edge.confidence * 100)}%)</span></div>
              <div class="kv-item"><span class="kv-label">Source Port</span><span class="kv-val mono">${fromDev.name}:${edge.from_link}</span></div>
              <div class="kv-item"><span class="kv-label">Peer Port</span><span class="kv-val mono">${toDev.name}:${edge.to_link}</span></div>
            </div>
            ${edge.member_links.length ? `<div class="text-xs dimmed">LAG members: <span class="mono">${edge.member_links.join(', ')}</span> (LACP)</div>` : ''}
            <div class="port-compare">
              <div class="port-compare-side">
                <div class="kv-label">${fromDev.name}:${edge.from_link}</div>
                <div class="mono text-xs" style="margin-top:4px">PVID: <strong>${fromCfg.pvid ?? '—'}</strong></div>
                <div class="mono text-xs">Tagged: <strong>${fromCfg.tagged.length ? fromCfg.tagged.join(', ') : 'none'}</strong></div>
              </div>
              <div class="port-compare-side">
                <div class="kv-label">${toDev.name}:${edge.to_link}</div>
                <div class="mono text-xs" style="margin-top:4px">PVID: <strong>${toCfg.pvid ?? '—'}</strong></div>
                <div class="mono text-xs">Tagged: <strong>${toCfg.tagged.length ? toCfg.tagged.join(', ') : 'none'}</strong></div>
              </div>
            </div>
            ${edgeAnoms.map((a) => `
              <div class="callout ${a.severity}">
                <div class="fw-700">${a.kind === 'leak' ? '⚠' : '⊘'} ${a.title}</div>
                <div class="text-xs" style="margin-top:4px">${a.summary}</div>
                <button class="btn btn-xs btn-primary" style="margin-top:8px" data-goto-flow="${a.vlans[0]}" data-goto-anom="${a.id}">Inspect in VLAN Flow →</button>
              </div>
            `).join('')}
            <div class="row" style="margin-top:4px">
              <button class="btn btn-xs" data-open-device="${fromDev.id}">Open ${fromDev.name}</button>
              <button class="btn btn-xs" data-open-device="${toDev.id}">Open ${toDev.name}</button>
            </div>

    const links = D.LINKS.filter((l) => l.device_id === dev.id);
    const upLinks = links.filter((l) => l.link_up).length;
    const clients = D.CLIENTS.filter((c) => c.attached_device_id === dev.id && c.online);
    const devAnoms = D.anomalies.filter((a) => a.from_device_id === dev.id || a.to_device_id === dev.id);

    return `
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Device Inspector</h3>
          <span class="badge badge-green badge-dot">Online</span>
        </div>
        <div class="card-body stack-sm">
          <div>
            <div class="fw-700" style="font-size:15px">${dev.name}</div>
            <div class="text-xs dimmed">${dev.vendor} · ${dev.model}</div>
          </div>
          <div class="row">
            <span class="badge badge-teal">${dev.driver}</span>
            <span class="badge badge-outline">${dev.role}</span>
          </div>
          <div class="kv-grid">

  <script>
/* === vlan-flow.js === */
/* Andaru Netplane — VLAN Flow Diagram (issue andaru-project/netplane#18)
 * Draws cross-device VLAN configuration (port-by-port T/U/LAG/Wi-Fi) and its consequences
 * (L3 zone reachability, dead-ends, and cross-VLAN PVID leaks).
 */
(function (global) {
  'use strict';

  const D = global.NETPLANE_DATA;

  const state = {
    mode: 'single',      // 'single' | 'all'
    vlanId: 10,          // active VLAN in single mode
    selectedAnomId: 'anom-leak-e-core-media'
  };

  function setFocus(vlanId, anomId) {
    if (vlanId) {
      state.mode = 'single';
      state.vlanId = Number(vlanId);
    }
    if (anomId) {
      state.selectedAnomId = anomId;
    } else {
      const matching = D.anomalies.find((a) => a.vlans.includes(state.vlanId));
      state.selectedAnomId = matching ? matching.id : null;
    }
  }

  function themeColors() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
      isDark,
      canvas: isDark ? '#121417' : '#fbfcfd',
      surface: isDark ? '#1a1b1e' : '#ffffff',
      subtle: isDark ? '#25262b' : '#f1f3f5',
      border: isDark ? '#373a40' : '#ced4da',
      borderSoft: isDark ? '#2c2e33' : '#e9ecef',
      text: isDark ? '#e9ecef' : '#17212c',
      dim: isDark ? '#909296' : '#526171',
      green: isDark ? '#40c057' : '#2b8a3e',
      amber: isDark ? '#fab005' : '#e67700',
      amberInk: '#17212c',
      red: isDark ? '#ff6b6b' : '#c92a2a',
      blue: isDark ? '#4dabf7' : '#1971c2',
      gray: isDark ? '#5c5f66' : '#adb5bd'
    };
  }

  function bezier(x1, y1, x2, y2) {
    const dx = Math.max(36, (x2 - x1) * 0.48);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function renderPortChip(x, y, align, label, mode, color, C) {
    // align: 'left' (chip starts at x going right) or 'right' (chip ends at x going left)
    const badgeW = 19;
    const textW = Math.max(38, label.length * 6.4 + 8);
    const totalW = textW + badgeW + 6;
    const startX = align === 'left' ? x : x - totalW;
    const bx = align === 'left' ? startX + 3 : startX + textW + 3;
    const tx = align === 'left' ? startX + badgeW + 7 : startX + 5;

    let bFill = C.subtle;
    let bStroke = C.border;
    let bText = C.dim;
    let glyph = '·';

    if (mode === 'T') {
      bFill = color;
      bStroke = color;
      bText = C.isDark ? '#101418' : '#ffffff';
      glyph = 'T';
    } else if (mode === 'U') {
      bFill = C.surface;
      bStroke = color;
      bText = color;
      glyph = 'U';
    } else if (mode === 'X') {
      bFill = C.isDark ? 'rgba(250,176,5,0.2)' : 'rgba(230,119,0,0.14)';
      bStroke = C.amber;
      bText = C.amber;
      glyph = '✕';
    } else if (mode === 'LEAK') {
      bFill = C.red;
      bStroke = C.red;
      bText = '#ffffff';
      glyph = '⇄';
    }

    return `
      <g transform="translate(${startX}, ${y - 11})">
        <rect width="${totalW}" height="22" rx="4" fill="${C.subtle}" stroke="${mode === 'LEAK' ? C.red : mode === 'X' ? C.amber : C.borderSoft}" stroke-width="1" />
        <rect x="${bx - startX}" y="2.5" width="${badgeW}" height="17" rx="3" fill="${bFill}" stroke="${bStroke}" stroke-width="${mode === 'U' ? 1.6 : 1}" ${mode === 'U' ? 'stroke-dasharray="3,1.5"' : ''} />
        <text x="${bx - startX + badgeW / 2}" y="14.5" text-anchor="middle" fill="${bText}" font-size="10.5" font-weight="800" font-family="ui-monospace, monospace">${glyph}</text>
        <text x="${tx - startX}" y="14.5" fill="${C.text}" font-size="10.5" font-weight="600" font-family="ui-monospace, monospace">${label}</text>
      </g>`;
  }

  function renderRibbon(opts, C) {
    const { x1, y1, x2, y2, color, mode, kind, pill, anom, gradId } = opts;
    const d = bezier(x1, y1, x2, y2);
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;

    if (anom && anom.kind === 'dead_end') {
      const stopX = x1 + (x2 - x1) * 0.50;
      const stopY = y1 + (y2 - y1) * 0.50;
      const dBefore = bezier(x1, y1, stopX - 6, stopY);
      const dAfter = bezier(stopX + 6, stopY, x2, y2);
      const pw = 86;
      return {
        path: `
          <g class="flow-hit" data-anom-id="${anom.id}" style="cursor:pointer">
            <path d="${d}" fill="none" stroke="transparent" stroke-width="18" />
            <path d="${dBefore}" fill="none" stroke="${color}" stroke-width="3.2" ${kind === 'wireless_uplink' ? 'stroke-dasharray="5,4"' : ''} />
            <path d="${dAfter}" fill="none" stroke="${C.amber}" stroke-width="2" stroke-dasharray="4,4" opacity="0.72" />
            <line x1="${stopX}" y1="${stopY - 12}" x2="${stopX}" y2="${stopY + 12}" stroke="${C.amber}" stroke-width="3.2" stroke-linecap="round" />
          </g>`,
        overlay: `
          <g class="flow-hit" data-anom-id="${anom.id}" style="cursor:pointer">
            <rect x="${stopX - pw / 2}" y="${stopY - 28}" width="${pw}" height="19" rx="4" fill="${C.amber}" />
            <text x="${stopX}" y="${stopY - 15}" text-anchor="middle" fill="${C.amberInk}" font-size="9.5" font-weight="800" font-family="ui-monospace, monospace">⊘ DEAD-END</text>
          </g>`
      };
    }

    if (anom && anom.kind === 'leak') {
      const lbl = `⚠ LEAK ${anom.vlans[0]}→${anom.vlans[1]}`;
      const pw = 104;
      return {
        path: `
          <g class="flow-hit" data-anom-id="${anom.id}" style="cursor:pointer">
            <path d="${d}" fill="none" stroke="transparent" stroke-width="20" />
            <path d="${d}" fill="none" stroke="url(#${gradId})" stroke-width="6.5" stroke-linecap="round" />
            <path d="${d}" fill="none" stroke="${C.canvas}" stroke-width="2" stroke-dasharray="5,5" />
          </g>`,
        overlay: `
          <g class="flow-hit" data-anom-id="${anom.id}" style="cursor:pointer">
            <rect x="${mx - pw / 2}" y="${my - 11}" width="${pw}" height="22" rx="4" fill="${C.red}" stroke="${C.surface}" stroke-width="1.2" />
            <text x="${mx}" y="${my + 3.5}" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800" font-family="ui-monospace, monospace">${lbl}</text>

    }

    let strokes = '';
    if (kind === 'lag') {

    } else if (kind === 'wireless_uplink') {

    } else {
      strokes = `<path d="${d}" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="round" />`;
    }

    let overlay = '';
    if (pill) {
      const pw = Math.max(26, pill.length * 6.0 + 12);
      overlay = `
        <g>
          <rect x="${mx - pw / 2}" y="${my - 9.5}" width="${pw}" height="19" rx="4" fill="${C.surface}" stroke="${color}" stroke-width="1.3" />
          <text x="${mx}" y="${my + 3.5}" text-anchor="middle" fill="${color}" font-size="9.5" font-weight="700" font-family="ui-monospace, monospace">${pill}</text>
        </g>`;
    }

    return { path: `<g>${strokes}</g>`, overlay };
  }

    const hallSsids = D.RADIOS.filter((r) => r.device_id === 'unifi:ap-hallway').flatMap((r) => r.ssids.filter((s) => s.vlan_id === vid));

    nodesSvg += `

  function renderAllVlansSvg() {

    const distDevs = [

      { id: 'unifi:sw-media',          name: 'sw-living-poe',  sub: 'unifi · port1',        y: 210, vlans: [10, 20, 30, 99], dead: [], leak: true },

    distDevs.forEach((dd, dIdx) => {
      svg += `

          <rect width="206" height="128" rx="6" fill="${C.surface}" stroke="${dd.leak ? C.red : dd.dead.length ? C.amber : C.border}" stroke-width="${dd.leak || dd.dead.length ? 1.6 : 1.2}" />
          <rect width="206" height="34" rx="6" fill="${C.subtle}" />

          <text x="12" y="114" fill="${dd.leak ? C.red : dd.dead.length ? C.amber : C.green}" font-size="10" font-weight="700" font-family="ui-monospace, monospace">

      dd.vlans.forEach((vid, i) => {

        const isLeaked = dd.leak && (vid === 10 || vid === 20);
        svg += `<path class="flow-pick-vlan" data-pick-vlan="${vid}" d="${bezier(490, y1, 616, y2)}" fill="none" stroke="${isLeaked ? C.red : col}" stroke-width="${isLeaked ? 3.5 : 2.4}" style="cursor:pointer" />`;

    svg += `

        <text x="12" y="44" fill="${C.dim}" font-size="10.5" font-family="ui-monospace, monospace">VLAN 10: voip-base, ps5</text>
        <text x="12" y="62" fill="${C.dim}" font-size="10.5" font-family="ui-monospace, monospace">VLAN 20: 2 cams, ATV, Sonos</text>
        <text x="12" y="86" fill="${C.red}" font-size="10.5" font-weight="700" font-family="ui-monospace, monospace">⚠ Zone lan ⇄ iot bridged!</text>
      </g>
      <g class="flow-dev" data-device-id="unifi:ap-garage" transform="translate(938, 370)" style="cursor:pointer">

        <text x="12" y="22" fill="${C.text}" font-size="12" font-weight="700">ap-garage-mesh (Wi-Fi)</text>
        <text x="12" y="44" fill="${C.dim}" font-size="10.5" font-family="ui-monospace, monospace">Home-Core (V10) · OK</text>
        <text x="12" y="62" fill="${C.dim}" font-size="10.5" font-family="ui-monospace, monospace">Home-IoT + EV (V20) · OK</text>
        <text x="12" y="86" fill="${C.amber}" font-size="10.5" font-weight="700" font-family="ui-monospace, monospace">⊘ Home-Guest (V30) stranded</text>
      </g>
    `;

    svg += `<path d="${bezier(822, 114, 938, 114)}" fill="none" stroke="${C.border}" stroke-width="2" />`;
    svg += `<path d="${bezier(822, 274, 938, 274)}" fill="none" stroke="${C.red}" stroke-width="2.5" />`;
    [10, 20, 99].forEach((vid, i) => {
      svg += `<path class="flow-pick-vlan" data-pick-vlan="${vid}" d="${bezier(822, 408 + i * 14, 938, 408 + i * 14)}" fill="none" stroke="${D.getVlanColor(vid)}" stroke-width="2.2" stroke-dasharray="5,3" style="cursor:pointer" />`;
    });
    svg += `
      <g class="flow-hit" data-anom-id="anom-mesh-e-hallway-garage-v30" style="cursor:pointer">
        <path d="${bezier(822, 460, 875, 460)}" fill="none" stroke="${D.getVlanColor(30)}" stroke-width="2.4" stroke-dasharray="4,3" />
        <line x1="880" y1="450" x2="880" y2="470" stroke="${C.amber}" stroke-width="3" />
        <rect x="841" y="476" width="78" height="18" rx="4" fill="${C.amber}" />
        <text x="880" y="488.5" text-anchor="middle" fill="${C.amberInk}" font-size="9.5" font-weight="800" font-family="ui-monospace, monospace">⊘ V30 MESH</text>
      </g>`;

    return `<svg style="width:100%;min-width:840px;height:auto" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="All VLANs propagation overview">${svg}</svg>`;
  }

  function renderInspector(nav) {
    const anom = D.anomalies.find((a) => a.id === state.selectedAnomId)
      || (state.mode === 'single' ? D.anomalies.find((a) => a.vlans.includes(state.vlanId)) : D.anomalies[0]);

    if (!anom) {
      const v = D.getVlan(state.vlanId);
      return `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Consequence Inspector</h3>
            <span class="badge badge-green">✓ Clean End-to-End</span>
          </div>
          <div class="card-body stack-sm">
            <div class="fw-700">VLAN ${v.id} · ${v.name} (${v.subnet4})</div>
            <p class="text-sm dimmed" style="margin:0">
              No dead-ends, missing trunks, or PVID mismatches detected. Every device configured for VLAN ${v.id} has a clean, symmetrically tagged or untagged path back to gateway <span class="mono">${v.gateway}</span> on <span class="mono">fw-core</span> (zone <span class="mono">${v.zone}</span>).
            </p>
            <div class="kv-grid">
              <div class="kv-item"><span class="kv-label">Gateway</span><span class="kv-val mono">${v.gateway}</span></div>
              <div class="kv-item"><span class="kv-label">Security Zone</span><span class="kv-val mono">${v.zone}</span></div>
            </div>
          </div>
        </div>`;
    }

    const fromDev = D.getDevice(anom.from_device_id);
    const toDev = D.getDevice(anom.to_device_id);

    return `
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Consequence Inspector</h3>
          <span class="badge ${anom.severity === 'crit' ? 'badge-red' : 'badge-amber'}">
            ${anom.kind === 'leak' ? '⚠ CROSS-VLAN LEAK' : '⊘ VLAN DEAD-END'}
          </span>
        </div>
        <div class="card-body stack-sm">
          <div class="fw-700" style="font-size:14.5px">${anom.title}</div>
          <p class="text-sm" style="margin:0">${anom.summary}</p>

          <div class="port-compare">
            <div class="port-compare-side">
              <div class="kv-label">${fromDev.name}:${anom.from_link}</div>
              <div class="mono text-xs" style="margin-top:4px">Untagged (PVID): <strong>${anom.from_cfg.pvid ?? '—'}</strong></div>
              <div class="mono text-xs">Tagged: <strong>${anom.from_cfg.tagged.length ? anom.from_cfg.tagged.join(', ') : 'none'}</strong></div>
            </div>
            <div class="port-compare-side">
              <div class="kv-label">${toDev.name}:${anom.to_link}</div>
              <div class="mono text-xs" style="margin-top:4px">Untagged (PVID): <strong>${anom.to_cfg.pvid ?? '—'}</strong></div>
              <div class="mono text-xs">Tagged: <strong>${anom.to_cfg.tagged.length ? anom.to_cfg.tagged.join(', ') : 'none'}</strong></div>
            </div>
          </div>

          <div class="callout ${anom.severity}">
            <div class="kv-label" style="margin-bottom:3px">Consequence</div>
            <div>${anom.consequence}</div>
          </div>

          <div>
            <div class="kv-label" style="margin-bottom:4px">Affected Endpoints</div>
            <ul style="margin:0;padding-left:18px" class="text-xs">
              ${anom.affected.map((x) => `<li class="mono" style="margin-bottom:2px">${x}</li>`).join('')}
            </ul>
          </div>

          <div class="callout">
            <div class="kv-label" style="margin-bottom:3px">Suggested Fix</div>
            <div class="text-xs">${anom.remediation}</div>
          </div>

          <div class="row">
            <button class="btn btn-xs" data-open-port="${fromDev.id}|${anom.from_link}">Inspect ${fromDev.name}:${anom.from_link}</button>
            <button class="btn btn-xs" data-open-port="${toDev.id}|${anom.to_link}">Inspect ${toDev.name}:${anom.to_link}</button>
          </div>
        </div>
      </div>`;
  }

  function render(container, nav) {
    const leakCount = D.anomalies.filter((a) => a.kind === 'leak').length;
    const deadCount = D.anomalies.filter((a) => a.kind === 'dead_end').length;

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2 class="page-title">VLAN Flow</h2>
          <p class="page-subtitle">Port-by-port VLAN propagation across trunks, LAGs, and wireless uplinks—highlighting dead-ends and cross-VLAN leaks.</p>
        </div>
        <div class="page-actions">
          <div class="segmented" role="tablist" aria-label="VLAN Flow mode">
            <button role="tab" aria-selected="${state.mode === 'single'}" class="${state.mode === 'single' ? 'active' : ''}" data-flow-mode="single">Single VLAN</button>
            <button role="tab" aria-selected="${state.mode === 'all'}" class="${state.mode === 'all' ? 'active' : ''}" data-flow-mode="all">All VLANs</button>
          </div>
        </div>
      </div>

      <div class="stack">
        <!-- VLAN Selector Pills -->
        <div class="card card-pad">
          <div class="row-between">
            <div class="vlan-pill-bar" role="group" aria-label="Select VLAN">
              ${D.VLANS.map((v) => {
                const anoms = D.anomalies.filter((a) => a.vlans.includes(v.id));
                const isLeak = anoms.some((a) => a.kind === 'leak');
                const isDead = anoms.some((a) => a.kind === 'dead_end');
                const active = state.mode === 'single' && state.vlanId === v.id;
                return `
                  <button class="vlan-pill ${active ? 'active' : ''}" data-vlan-pill="${v.id}">
                    <span class="vlan-swatch" style="background:var(${v.colorVar})"></span>
                    <span class="mono">${v.id}</span>
                    <span>${v.name}</span>
                    ${isLeak ? '<span class="badge badge-red">⚠ Leak</span>' : isDead ? '<span class="badge badge-amber">⊘ Dead-end</span>' : '<span class="badge badge-green">✓</span>'}
                  </button>`;
              }).join('')}
            </div>
            <div class="row text-xs dimmed">
              <span class="badge badge-red">${leakCount} Leak</span>
              <span class="badge badge-amber">${deadCount} Dead-ends</span>
            </div>
          </div>
        </div>

        <!-- Full-Width Flow Canvas -->
        <div class="card">
          <div class="svg-stage" id="vlan-flow-svg-stage">
            ${state.mode === 'single' ? renderSingleVlanSvg(state.vlanId) : renderAllVlansSvg()}
          </div>
          <div class="legend-bar">
            <span class="legend-item"><span class="tag-chip t">T</span> Tagged (solid)</span>
            <span class="legend-item"><span class="tag-chip u">U</span> Untagged / PVID (double-rail)</span>
            <span class="legend-item"><svg width="24" height="10"><line x1="0" y1="3" x2="24" y2="3" stroke="var(--primary)" stroke-width="2"/><line x1="0" y1="7" x2="24" y2="7" stroke="var(--primary)" stroke-width="2"/></svg> LAG Trunk</span>
            <span class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="var(--vlan-30)" stroke-width="2" stroke-dasharray="4,3"/></svg> Wireless Mesh</span>
            <span class="legend-item"><span class="badge badge-amber">⊘ Dead-End</span> Missing on trunk / uplink</span>
            <span class="legend-item"><span class="badge badge-red">⚠ Leak</span> PVID mismatch / zone cross</span>
          </div>
        </div>

        <!-- Consequence Inspector + Findings List below full-width diagram -->
        <div class="grid-2-asym">
          ${renderInspector(nav)}

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">All Detected Findings (${D.anomalies.length})</h3>
            </div>
            <div class="alert-list">
              ${D.anomalies.map((a) => `
                <div class="alert-row ${a.severity}" style="cursor:pointer;${a.id === state.selectedAnomId ? 'background:var(--primary-soft);' : ''}" data-select-anom="${a.id}" data-anom-vlan="${a.vlans[0]}">
                  <div class="alert-row-body">
                    <div class="alert-row-title text-xs">
                      <span class="badge ${a.severity === 'crit' ? 'badge-red' : 'badge-amber'}">${a.kind === 'leak' ? 'LEAK' : 'DEAD-END'}</span>
                      <span>${a.short_label}</span>
                    </div>
                    <div class="alert-row-desc mono">${D.getDevice(a.from_device_id).name}:${a.from_link} ↔ ${D.getDevice(a.to_device_id).name}:${a.to_link}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;

    // Event bindings
    container.querySelectorAll('[data-flow-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.mode = btn.getAttribute('data-flow-mode');
        render(container, nav);
      });
    });

    container.querySelectorAll('[data-vlan-pill]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const vid = Number(btn.getAttribute('data-vlan-pill'));
        setFocus(vid, null);
        render(container, nav);
      });
    });

    container.querySelectorAll('[data-pick-vlan]').forEach((el) => {
      el.addEventListener('click', () => {
        const vid = Number(el.getAttribute('data-pick-vlan'));
        setFocus(vid, null);
        render(container, nav);
      });
    });

    container.querySelectorAll('[data-anom-id]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const aid = el.getAttribute('data-anom-id');
        const an = D.anomalies.find((a) => a.id === aid);
        if (an) {
          state.selectedAnomId = aid;
          if (state.mode === 'all') {
            state.mode = 'single';
            state.vlanId = an.vlans[0];
          }
          render(container, nav);
        }
      });
    });

    container.querySelectorAll('[data-select-anom]').forEach((el) => {
      el.addEventListener('click', () => {
        const aid = el.getAttribute('data-select-anom');
        const vid = Number(el.getAttribute('data-anom-vlan'));
        setFocus(vid, aid);
        render(container, nav);
      });
    });

    container.querySelectorAll('.flow-dev').forEach((el) => {
      el.addEventListener('click', () => nav.openDevice(el.getAttribute('data-device-id')));
    });

    container.querySelectorAll('[data-open-port]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [devId, portName] = btn.getAttribute('data-open-port').split('|');
        nav.openDevice(devId, portName);
      });
    });
  }

  global.NETPLANE_VLAN_FLOW = { render, setFocus, setMode: (m) => { state.mode = m; } };
})(window);

  </script>
  <script>
/* === app.js === */
/* Andaru Netplane — Main SPA Prototype Controller
 * Screens: Overview, Topology, VLAN Flow, Devices (+ Device Detail with Port Faceplate),
 * VLANs & Segments (+ Port Tagging Matrix), Clients.
 */
(function (global) {
  'use strict';

  const D = global.NETPLANE_DATA;

  const appState = {
    route: 'overview',
    deviceId: 'openwrt:sw-core',
    selectedPort: null,
    faceplateVlan: null,
    deviceFilter: '',
    vlanMatrixOnlyAnom: false,
    vlanMatrixDevice: 'all',
    clientQuery: '',
    clientType: 'all',
    clientVlan: 'all'
  };

  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function closeMobileNav() {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('nav-backdrop')?.classList.remove('open');
  }

  const nav = {
    go(route) {
      appState.route = route;
      closeMobileNav();
      window.location.hash = route;
      render();
    },
    openDevice(deviceId, portName) {
      appState.route = 'device-detail';
      appState.deviceId = deviceId;
      appState.selectedPort = portName || null;
      appState.faceplateVlan = null;
      closeMobileNav();
      window.location.hash = `device/${encodeURIComponent(deviceId)}`;
      render();
    },
    openVlanFlow(vlanId, anomId) {
      if (vlanId) global.NETPLANE_VLAN_FLOW.setFocus(vlanId, anomId || null);
      appState.route = 'vlan-flow';
      closeMobileNav();
      window.location.hash = 'vlan-flow';
      render();
    }
  };

  function driverBadge(driver) {
    const map = {
      andaru: 'badge-solid-amber',
      openwrt: 'badge-teal',
      rtlplayground: 'badge-blue',
      unifi: 'badge-cyan',
      pfsense: 'badge-outline',
      opnsense: 'badge-outline',
      snmp: 'badge-gray'
    };
    return `<span class="badge ${map[driver] || 'badge-gray'}">${driver}</span>`;
  }

  function vlanChip(vid) {
    const v = D.getVlan(vid);
    if (!v) return `<span class="badge badge-gray mono">VLAN ${vid}</span>`;
    return `<span class="badge badge-outline mono"><span class="vlan-swatch" style="background:var(${v.colorVar})"></span>${v.id} · ${v.name}</span>`;
  }

  function portAnomalies(deviceId, ifName) {
    return D.anomalies.filter((a) =>
      (a.from_device_id === deviceId && a.from_link === ifName) ||
      (a.to_device_id === deviceId && a.to_link === ifName)
    );
  }

  /* ==================== SCREEN 1: OVERVIEW ==================== */
  function renderOverview(container) {
    const onlineDevs = D.DEVICES.filter((d) => d.online).length;
    const onlineClients = D.CLIENTS.filter((c) => c.online);
    const wiredClients = onlineClients.filter((c) => c.connection_type === 'wired').length;
    const wifiClients = onlineClients.filter((c) => c.connection_type === 'wireless').length;
    const leakCount = D.anomalies.filter((a) => a.kind === 'leak').length;
    const deadCount = D.anomalies.filter((a) => a.kind === 'dead_end').length;
    const sfpWarnLink = D.LINKS.find((l) => l.sfp && l.sfp.alert_state !== 'ok');
    const poeDev = D.DEVICES.find((d) => d.poe_budget);
    const gw = D.GATEWAYS[0];
    const fw = D.FIREWALLS[0];

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2 class="page-title">Overview</h2>
          <p class="page-subtitle">Unified inventory, L2/L3 VLAN health, and live telemetry across ${D.DEVICES.length} devices and 4 drivers.</p>
        </div>
        <div class="page-actions">
          <button class="btn" id="ov-goto-topo">Open Topology</button>
          <button class="btn btn-primary" id="ov-goto-flow">Inspect VLAN Flow (${D.anomalies.length})</button>
        </div>
      </div>

      <div class="stack">
        <!-- 4 KPI Cards -->
        <div class="grid-4">
          <button class="kpi-card clickable" data-nav="devices">
            <span class="kpi-label">Devices Online</span>
            <span class="kpi-value">${onlineDevs} / ${D.DEVICES.length}</span>
            <span class="kpi-meta"><span class="badge badge-green badge-dot">All polling</span> <span>4 drivers</span></span>
          </button>

          <button class="kpi-card clickable" data-nav="vlan-flow">
            <span class="kpi-label">VLAN Health</span>
            <span class="kpi-value" style="color:var(--red)">${D.anomalies.length} Issues</span>
            <span class="kpi-meta"><span class="badge badge-red">${leakCount} Leak</span> <span class="badge badge-amber">${deadCount} Dead-ends</span></span>
          </button>

          <button class="kpi-card clickable" data-nav="clients">
            <span class="kpi-label">Active Clients</span>
            <span class="kpi-value">${onlineClients.length}</span>
            <span class="kpi-meta"><span>${wiredClients} wired</span> · <span>${wifiClients} wireless</span></span>
          </button>

          <button class="kpi-card clickable" data-open-device="andaru:fw-core">
            <span class="kpi-label">WAN & PoE</span>
            <span class="kpi-value mono">${gw.rtt_ms.toFixed(1)} ms</span>
            <span class="kpi-meta"><span class="badge badge-green">${gw.loss_pct}% loss</span> <span>PoE ${poeDev.poe_budget.used_watts}/${poeDev.poe_budget.total_watts}W</span></span>
          </button>
        </div>

        <!-- Attention Required -->
        <div class="card">
          <div class="card-header">
            <div class="row">
              <h3 class="card-title">Attention Required</h3>
              <span class="badge badge-red">${D.anomalies.length + (sfpWarnLink ? 1 : 0)} Active Findings</span>
            </div>
            <span class="text-xs dimmed">Derived live from LLDP, port VLANs, wireless uplinks, and SFP DOM</span>
          </div>
          <div class="alert-list">
            ${D.anomalies.map((a) => `
              <div class="alert-row ${a.severity}">
                <div class="alert-row-body">
                  <div class="alert-row-title">
                    <span class="badge ${a.severity === 'crit' ? 'badge-red' : 'badge-amber'}">${a.kind === 'leak' ? 'CRIT · LEAK' : 'WARN · DEAD-END'}</span>
                    <span>${a.title}</span>
                  </div>
                  <div class="alert-row-desc">${a.summary}</div>
                </div>
                <button class="btn btn-xs" data-goto-flow="${a.vlans[0]}" data-goto-anom="${a.id}">Inspect in VLAN Flow →</button>
              </div>
            `).join('')}
            ${sfpWarnLink ? `
              <div class="alert-row warn">
                <div class="alert-row-body">
                  <div class="alert-row-title">
                    <span class="badge badge-amber">WARN · SFP DOM</span>
                    <span>Low optical RX power on ${D.getDevice(sfpWarnLink.device_id).name}:${sfpWarnLink.if_name}</span>
                  </div>
                  <div class="alert-row-desc mono">RX ${sfpWarnLink.sfp.rx_power_dbm.toFixed(2)} dBm (threshold &lt; -20.0 dBm) · ${sfpWarnLink.sfp.vendor} ${sfpWarnLink.sfp.part_number} · ${sfpWarnLink.counters.rx_errors} RX errors</div>
                </div>
                <button class="btn btn-xs" data-open-port="${sfpWarnLink.device_id}|${sfpWarnLink.if_name}">Inspect Port →</button>
              </div>
            ` : ''}
          </div>
        </div>

        <!-- Two-Column Operational Summary -->
        <div class="grid-2-asym">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Infrastructure Devices</h3>
              <button class="btn btn-xs btn-subtle" data-nav="devices">View all →</button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr><th>Device</th><th>Driver</th><th>Role</th><th>Mgmt IP</th><th>Ports</th><th>Health</th></tr>
                </thead>
                <tbody>
                  ${D.DEVICES.map((dev) => {
                    const links = D.LINKS.filter((l) => l.device_id === dev.id);
                    const up = links.filter((l) => l.link_up).length;
                    const hasLeak = D.anomalies.some((a) => a.kind === 'leak' && (a.from_device_id === dev.id || a.to_device_id === dev.id));
                    const hasWarn = D.anomalies.some((a) => a.kind === 'dead_end' && (a.from_device_id === dev.id || a.to_device_id === dev.id))
                      || links.some((l) => l.sfp && l.sfp.alert_state !== 'ok');
                    return `
                      <tr class="clickable" data-open-device="${dev.id}">
                        <td class="fw-600">${dev.name}</td>
                        <td>${driverBadge(dev.driver)}</td>
                        <td class="text-xs dimmed">${dev.role}</td>
                        <td class="mono">${dev.mgmt_ip}</td>
                        <td class="mono">${up}/${links.length}</td>
                        <td>${hasLeak ? '<span class="badge badge-red">⚠ Leak</span>' : hasWarn ? '<span class="badge badge-amber">Warn</span>' : '<span class="badge badge-green">Healthy</span>'}</td>
                      </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Gateway & Firewall</h3>
                <span class="badge badge-green">nftables · v${fw.saved_version}</span>
              </div>
              <div class="card-body stack-sm">
                ${D.GATEWAYS.map((g) => `
                  <div class="row-between">
                    <div>
                      <div class="fw-600 text-sm">${g.name} <span class="dimmed mono text-xs">(${g.family})</span></div>
                      <div class="mono text-xs dimmed">${g.gateway_ip} · monitor ${g.monitor_ip}</div>
                    </div>
                    <span class="badge badge-green mono">${g.rtt_ms.toFixed(1)} ms · ${g.loss_pct}%</span>
                  </div>
                `).join('')}
                <div style="padding-top:6px;border-top:1px solid var(--border-subtle)">
                  <div class="row-between text-xs">
                    <span class="dimmed">Conntrack States</span>
                    <span class="mono">${fw.states_used.toLocaleString()} / ${fw.states_max.toLocaleString()}</span>
                  </div>
                  <div class="meter" style="margin-top:4px"><div class="meter-fill" style="width:${Math.max(3, Math.round((fw.states_used / fw.states_max) * 100))}%"></div></div>
                </div>
                <div class="row" style="margin-top:2px">
                  ${fw.services.map((s) => `<span class="badge badge-green badge-dot">${s.name}</span>`).join('')}
                </div>
              </div>

            <div class="card">

                <h3 class="card-title">Recent Live Events (SSE)</h3>
                <span class="badge badge-teal badge-dot">Streaming</span>
              </div>
              <div class="alert-list">
                ${D.EVENTS.map((ev) => `
                  <div class="alert-row ${ev.severity === 'warn' ? 'warn' : ''}" style="padding:9px 14px">
                    <div class="alert-row-body">
                      <div class="alert-row-title text-xs">
                        <span class="badge ${ev.severity === 'warn' ? 'badge-amber' : 'badge-blue'} mono">${ev.type}</span>
                        <span class="dimmed mono">${ev.timestamp.slice(11, 19)} UTC</span>

    container.querySelectorAll('[data-open-device]').forEach((el) => el.addEventListener('click', () => nav.openDevice(el.getAttribute('data-open-device'))));

  /* ==================== SCREEN 2: DEVICES LIST ==================== */
  function renderDevicesList(container) {
    const q = appState.deviceFilter.trim().toLowerCase();
    const filtered = D.DEVICES.filter((d) =>
      !q || [d.name, d.driver, d.role, d.model, d.mgmt_ip, d.vendor].join(' ').toLowerCase().includes(q)
    );

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2 class="page-title">Devices</h2>
          <p class="page-subtitle">Managed firewalls, switches, and access points across drivers. Select any device to inspect its port faceplate.</p>
        </div>
        <div class="page-actions">
          <input id="dev-search" class="input" type="search" placeholder="Filter devices, drivers, IP..." value="${appState.deviceFilter}" style="width:240px" />
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th><th>Driver</th><th>Role</th><th>Model</th><th>Mgmt IP</th><th>Ports</th><th>Firmware</th><th>Uptime</th><th>Findings</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map((d) => {
                const links = D.LINKS.filter((l) => l.device_id === d.id);
                const up = links.filter((l) => l.link_up).length;
                const anoms = D.anomalies.filter((a) => a.from_device_id === d.id || a.to_device_id === d.id);
                const sfpWarn = links.some((l) => l.sfp && l.sfp.alert_state !== 'ok');
                const fwUpd = d.firmware.available && d.firmware.available !== d.firmware.current;
                return `
                  <tr class="clickable" data-open-device="${d.id}">
                    <td class="fw-700">${d.name}</td>
                    <td>${driverBadge(d.driver)}</td>
                    <td>${d.role}</td>
                    <td class="text-xs">${d.model}</td>
                    <td class="mono">${d.mgmt_ip}</td>
                    <td class="mono">${up} / ${links.length}</td>
                    <td class="mono text-xs">${d.firmware.current}${fwUpd ? ' <span class="badge badge-blue">Update</span>' : ''}</td>
                    <td class="mono text-xs">${D.formatUptime(d.uptime_sec)}</td>
                    <td>
                      ${anoms.some((a) => a.kind === 'leak') ? '<span class="badge badge-red">⚠ Leak</span> ' : ''}
                      ${anoms.some((a) => a.kind === 'dead_end') ? '<span class="badge badge-amber">⊘ Dead-end</span> ' : ''}
                      ${sfpWarn ? '<span class="badge badge-amber">DOM</span> ' : ''}
                      ${!anoms.length && !sfpWarn ? '<span class="dimmed text-xs">None</span>' : ''}

                    <td><span class="badge badge-green badge-dot">Online</span></td>
                  </tr>`;

          </table>
