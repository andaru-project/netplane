    `;

    const input = container.querySelector('#dev-search');
    if (input) {
      input.addEventListener('input', () => {
        appState.deviceFilter = input.value;
        renderDevicesList(container);
        const refocus = container.querySelector('#dev-search');
        if (refocus) { refocus.focus(); refocus.setSelectionRange(refocus.value.length, refocus.value.length); }
      });
    }
    container.querySelectorAll('[data-open-device]').forEach((el) => {
      el.addEventListener('click', () => nav.openDevice(el.getAttribute('data-open-device')));
    });
  }

  /* ==================== SCREEN 3: DEVICE DETAIL + PORT FACEPLATE ==================== */
  function renderPortTile(link, selectedName, hlVlan) {
    const isSel = link.if_name === selectedName;
    const isStpBlock = link.stp_state === 'blocking' || link.stp_state === 'discarding';
    const anoms = portAnomalies(link.device_id, link.if_name);
    const hasDomWarn = link.sfp && link.sfp.alert_state !== 'ok';

    let cls = 'port-tile';
    if (link.is_fiber) cls += ' fiber';
    if (!link.admin_up) cls += ' disabled';
    else if (isStpBlock) cls += ' stp-block';
    else if (link.link_up) cls += ' up';
    else cls += ' down';
    if (isSel) cls += ' selected';

    let vlanTagBadge = '';
    if (hlVlan) {
      const isU = link.pvid === hlVlan;
      const isT = (link.tagged_vlans || []).includes(hlVlan);
      if (isU) { cls += ' vlan-match'; vlanTagBadge = `<span class="port-mini port-mini-u">U ${hlVlan}</span>`; }
      else if (isT) { cls += ' vlan-match'; vlanTagBadge = `<span class="port-mini port-mini-t">T ${hlVlan}</span>`; }
      else { cls += ' vlan-dim'; }
    }

    return `
      <button class="${cls}" data-select-port="${link.if_name}" aria-pressed="${isSel}" title="${link.if_name} (${link.media}) — ${link.label || link.oper_state}">
        <span class="port-name">${link.if_name}</span>
        <span class="port-jack ${link.is_fiber ? 'fiber-cage' : ''}">
          <span class="port-led"></span>
        </span>
        <span class="port-speed">${!link.admin_up ? 'OFF' : isStpBlock ? 'STP' : link.link_up ? D.formatSpeed(link.speed_mbps) : 'DOWN'}</span>
        <span class="port-tags-row">
          ${vlanTagBadge}
          ${!vlanTagBadge && link.is_fiber ? `<span class="port-mini port-mini-sfp">${link.media}</span>` : ''}
          ${!vlanTagBadge && link.poe && link.poe.enabled ? `<span class="port-mini port-mini-poe">⚡${link.poe.watts.toFixed(0)}W</span>` : ''}
          ${isStpBlock ? '<span class="port-mini port-mini-stp">BLK</span>' : ''}
          ${hasDomWarn ? '<span class="port-mini port-mini-dom">DOM</span>' : ''}
          ${anoms.length ? '<span class="port-mini port-mini-anom">⚠</span>' : ''}
        </span>
      </button>`;
  }

  function renderDeviceDetail(container) {
    const dev = D.getDevice(appState.deviceId) || D.DEVICES[0];
    const links = D.LINKS.filter((l) => l.device_id === dev.id).sort((a, b) => a.index - b.index);

    const segments = D.SEGMENTS.filter((s) => s.device_id === dev.id);
    const gateways = D.GATEWAYS.filter((g) => g.device_id === dev.id);
    const firewall = D.FIREWALLS.find((f) => f.device_id === dev.id);
    const radios = D.RADIOS.filter((r) => r.device_id === dev.id);
    const clients = D.CLIENTS.filter((c) => c.attached_device_id === dev.id);

    const selLink = links.find((l) => l.if_name === appState.selectedPort) || links[0] || null;
    if (selLink) appState.selectedPort = selLink.if_name;

    // Partition faceplate links into copper, standalone fiber, and LAG-grouped fiber/copper
    const lagMemberSet = new Set(lags.flatMap((g) => g.member_links));
    const copperLinks = links.filter((l) => !l.is_fiber && !lagMemberSet.has(l.if_name));

    container.innerHTML = `

            <div class="kv-item">

            <div class="kv-item">

            <div class="kv-item">
              <span class="kv-label">${dev.poe_budget ? 'PoE Budget' : 'Serial'}</span>
              ${dev.poe_budget
                ? `<span class="kv-val mono">${dev.poe_budget.used_watts}W / ${dev.poe_budget.total_watts}W</span>
                   <div class="meter" style="margin-top:4px"><div class="meter-fill" style="width:${Math.round((dev.poe_budget.used_watts / dev.poe_budget.total_watts) * 100)}%"></div></div>`
                : `<span class="kv-val mono">${dev.firmware.serial || '—'}</span>`}

        <!-- Hardware Port Faceplate -->
        <div class="card">
          <div class="card-header">
            <div class="row">

              <button class="btn btn-xs ${appState.faceplateVlan === null ? 'btn-active' : ''}" data-fp-vlan="none">None</button>
              ${D.VLANS.map((v) => `
                <button class="btn btn-xs mono ${appState.faceplateVlan === v.id ? 'btn-active' : ''}" data-fp-vlan="${v.id}">
                  <span class="vlan-swatch" style="background:var(${v.colorVar})"></span>${v.id}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="card-body stack">
            <div class="faceplate-bezel">
              <div class="faceplate-top-meta">
                <span>${dev.name.toUpperCase()} · ${dev.model}</span>

              </div>
              <div class="faceplate-ports-strip">
                ${copperLinks.length ? `<div class="faceplate-bank">${copperLinks.map((l) => renderPortTile(l, selLink?.if_name, appState.faceplateVlan)).join('')}</div>` : ''}
                ${(copperLinks.length && (standaloneFiber.length || lags.length)) ? '<div class="faceplate-divider"></div>' : ''}
                ${standaloneFiber.length ? `<div class="faceplate-bank">${standaloneFiber.map((l) => renderPortTile(l, selLink?.if_name, appState.faceplateVlan)).join('')}</div>` : ''}
                ${lags.map((g) => `

                    <div class="lag-bracket-ports">
                      ${g.member_links.map((mn) => {

                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Selected Port Inspector -->
            ${selLink ? `
              <div class="card" style="background:var(--bg-subtle)">
                <div class="card-header" style="background:var(--bg-surface)">
                  <div class="row">
                    <span class="mono fw-700" style="font-size:15px">${selLink.if_name}</span>

                    </div>
                    <div class="kv-item">
                      <span class="kv-label">Counters / PoE</span>
                      <span class="kv-val mono text-xs">
                        Err: ${(selLink.counters?.rx_errors || 0) + (selLink.counters?.tx_errors || 0)} · Drop: ${(selLink.counters?.rx_dropped || 0) + (selLink.counters?.tx_dropped || 0)}
                        ${selLink.poe?.supported ? ` · PoE ${selLink.poe.enabled ? selLink.poe.watts.toFixed(1) + 'W' : 'OFF'}` : ''}

                <tbody>

            ${firewall ? `
              <div class="card card-pad stack-sm">
                <h3 class="card-title">Firewall (${firewall.engine})</h3>
                <div class="text-sm">States: <span class="mono fw-600">${firewall.states_used.toLocaleString()} / ${firewall.states_max.toLocaleString()}</span> · Rules: <span class="mono">${firewall.policy_rule_count}</span> policy, <span class="mono">${firewall.nat_rule_count}</span> NAT</div>
                <div class="row">${firewall.services.map((sv) => `<span class="badge badge-green badge-dot">${sv.name}: ${sv.state}</span>`).join('')}</div>
              </div>
            ` : ''}
          </div>
        ` : ''}

        <!-- Attached Clients -->
        ${clients.length ? `
          <div class="card">
            <div class="card-header"><h3 class="card-title">Attached Clients (${clients.length})</h3></div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>Hostname</th><th>MAC</th><th>IP(s)</th><th>Port / SSID</th><th>VLAN</th><th>Status</th></tr></thead>
                <tbody>
                  ${clients.map((c) => `
                    <tr>
                      <td class="fw-600">${c.hostname}</td>
                      <td class="mono text-xs">${c.mac}</td>
                      <td class="mono text-xs">${c.ips.length ? c.ips.join(', ') : '<span class="dimmed">No DHCP</span>'}</td>
                      <td class="mono text-xs">${c.ssid ? `Wi-Fi: ${c.ssid}` : c.attached_link}</td>
                      <td>${vlanChip(c.vlan)}</td>
                      <td>${c.note ? `<span class="badge badge-amber">⊘ ${c.note}</span>` : '<span class="badge badge-green">Online</span>'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        ` : ''}
      </div>
    `;

    container.querySelector('#dd-back')?.addEventListener('click', (e) => { e.preventDefault(); nav.go('devices'); });
    container.querySelector('#dd-switcher')?.addEventListener('change', (e) => nav.openDevice(e.target.value));
    container.querySelectorAll('[data-select-port]').forEach((btn) => {
      btn.addEventListener('click', () => {
        appState.selectedPort = btn.getAttribute('data-select-port');
        renderDeviceDetail(container);
      });
    });
    container.querySelectorAll('[data-fp-vlan]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-fp-vlan');
        appState.faceplateVlan = val === 'none' ? null : Number(val);
        renderDeviceDetail(container);
      });
    });
    container.querySelectorAll('[data-open-device]').forEach((btn) => {
      btn.addEventListener('click', () => nav.openDevice(btn.getAttribute('data-open-device'), btn.getAttribute('data-open-port-name') || null));
    });
    container.querySelectorAll('[data-goto-flow]').forEach((btn) => {
      btn.addEventListener('click', () => nav.openVlanFlow(Number(btn.getAttribute('data-goto-flow')), btn.getAttribute('data-goto-anom')));
    });
  }

  /* ==================== SCREEN 4: VLANS & SEGMENTS (+ PORT MATRIX) ==================== */
  function renderVlans(container) {
    // Build cross-device port tagging matrix rows
    const matrixPorts = D.LINKS.filter((l) => {
      if (appState.vlanMatrixDevice !== 'all' && l.device_id !== appState.vlanMatrixDevice) return false;
      const anoms = portAnomalies(l.device_id, l.if_name);
      if (appState.vlanMatrixOnlyAnom) return anoms.length > 0 || (l.device_id === 'rtlplayground:sw-office' && l.pvid === 40);
      return l.pvid !== null || (l.tagged_vlans && l.tagged_vlans.length > 0);
    });

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2 class="page-title">VLANs & Segments</h2>
          <p class="page-subtitle">Unified L3 firewall segments, security zones, SSID mappings, and cross-switch 802.1Q tagging matrix.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="vlans-open-flow">Open VLAN Flow Diagram →</button>
        </div>
      </div>

      <div class="stack">
        <!-- VLAN Inventory Table -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Configured VLANs (${D.VLANS.length})</h3>
            <span class="text-xs dimmed">Click any row to trace its propagation in VLAN Flow</span>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>VLAN</th><th>Zone</th><th>Subnets (IPv4 / IPv6)</th><th>Ports (U / T)</th><th>SSIDs</th><th>Clients</th><th>Health</th><th></th>
                </tr>
              </thead>
              <tbody>
                ${D.VLANS.map((v) => {
                  const uCount = D.LINKS.filter((l) => l.pvid === v.id).length;
                  const tCount = D.LINKS.filter((l) => (l.tagged_vlans || []).includes(v.id)).length;
                  const ssids = Array.from(new Set(D.RADIOS.flatMap((r) => r.ssids.filter((s) => s.vlan_id === v.id).map((s) => s.name))));
                  const clCount = D.CLIENTS.filter((c) => c.vlan === v.id && c.online).length;
                  const anoms = D.anomalies.filter((a) => a.vlans.includes(v.id));
                  const isLeak = anoms.some((a) => a.kind === 'leak');
                  const isDead = anoms.some((a) => a.kind === 'dead_end');

                  return `
                    <tr class="clickable" data-trace-vlan="${v.id}">
                      <td>
                        <div class="row">
                          <span class="vlan-swatch" style="background:var(${v.colorVar});width:11px;height:11px"></span>
                          <div>
                            <div class="fw-700"><span class="mono">${v.id}</span> · ${v.name} ${v.isManagement ? '<span class="badge badge-blue">Mgmt</span>' : ''}</div>
                            <div class="text-xs dimmed">${v.desc}</div>
                          </div>
                        </div>
                      </td>
                      <td><span class="badge badge-outline mono">${v.zone}</span></td>
                      <td class="mono text-xs">${v.subnet4}${v.subnet6 !== '—' ? `<br><span class="dimmed">${v.subnet6}</span>` : ''}</td>
                      <td class="mono text-xs">${uCount} U · ${tCount} T</td>
                      <td class="text-xs">${ssids.length ? ssids.map((s) => `<span class="badge badge-outline">${s}</span>`).join(' ') : '<span class="dimmed">—</span>'}</td>
                      <td class="mono">${clCount}</td>
                      <td>
                        ${isLeak ? '<span class="badge badge-red">⚠ Leak</span>' : isDead ? '<span class="badge badge-amber">⊘ Dead-End</span>' : '<span class="badge badge-green">✓ Clean</span>'}
                      </td>
                      <td><button class="btn btn-xs" data-trace-vlan="${v.id}">Trace Flow →</button></td>
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Cross-Device Port Tagging Matrix (UniFi VLAN Viewer inspired) -->
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Cross-Device Port Tagging Matrix</h3>
              <span class="text-xs dimmed">Untagged (<span class="mono">U</span>) vs. Tagged (<span class="mono">T</span>) per port — flagged cells jump to VLAN Flow</span>
            </div>
            <div class="row">
              <select id="matrix-dev-filter" class="select">
                <option value="all" ${appState.vlanMatrixDevice === 'all' ? 'selected' : ''}>All Devices</option>
                ${D.DEVICES.map((d) => `<option value="${d.id}" ${appState.vlanMatrixDevice === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
              </select>
              <button class="btn btn-xs ${appState.vlanMatrixOnlyAnom ? 'btn-active' : ''}" id="matrix-anom-toggle">Anomalies only</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Device & Port</th>
                  <th>Role / Label</th>
                  ${D.VLANS.map((v) => `<th class="matrix-cell"><span class="vlan-swatch" style="background:var(${v.colorVar})"></span> ${v.id}<br><span style="font-weight:500">${v.name}</span></th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${matrixPorts.map((l) => {
                  const dev = D.getDevice(l.device_id);
                  const anoms = portAnomalies(l.device_id, l.if_name);
                  return `
                    <tr>
                      <td class="nowrap">
                        <a href="#device/${encodeURIComponent(dev.id)}" class="fw-600" data-open-port="${dev.id}|${l.if_name}">${dev.name}</a>:<span class="mono">${l.if_name}</span>
                        ${l.lag_group_id ? `<span class="badge badge-blue mono" style="margin-left:4px">${l.lag_group_id}</span>` : ''}
                      </td>
                      <td class="text-xs dimmed">${l.label || l.oper_state}</td>
                      ${D.VLANS.map((v) => {
                        const isU = l.pvid === v.id;
                        const isT = (l.tagged_vlans || []).includes(v.id);
                        const leakHere = anoms.find((a) => a.kind === 'leak' && a.vlans.includes(v.id));
                        const deadHere = anoms.find((a) => a.kind === 'dead_end' && a.vlans.includes(v.id));
                        if (leakHere) {
                          return `<td class="matrix-cell"><button class="tag-chip anom-leak" title="${leakHere.title}" data-goto-flow="${v.id}" data-goto-anom="${leakHere.id}">⚠ ${isU ? 'U' : 'T'}</button></td>`;
                        }
                        if (deadHere) {
                          return `<td class="matrix-cell"><button class="tag-chip anom-dead" title="${deadHere.title}" data-goto-flow="${v.id}" data-goto-anom="${deadHere.id}">${isT ? 'T ⊘' : '✕ ⊘'}</button></td>`;
                        }
                        if (l.device_id === 'rtlplayground:sw-office' && l.pvid === 40 && v.id === 40) {
                          return `<td class="matrix-cell"><button class="tag-chip anom-dead" title="Stranded access port (VLAN 40 dead-end)" data-goto-flow="40" data-goto-anom="anom-deadend-e-core-office-v40">U ⊘</button></td>`;
                        }
                        if (isU) return `<td class="matrix-cell"><span class="tag-chip u">U</span></td>`;
                        if (isT) return `<td class="matrix-cell"><span class="tag-chip t">T</span></td>`;
                        return `<td class="matrix-cell dimmed">·</td>`;
                      }).join('')}
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    container.querySelector('#vlans-open-flow')?.addEventListener('click', () => nav.go('vlan-flow'));
    container.querySelectorAll('[data-trace-vlan]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        nav.openVlanFlow(Number(el.getAttribute('data-trace-vlan')));
      });
    });
    container.querySelectorAll('[data-goto-flow]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        nav.openVlanFlow(Number(el.getAttribute('data-goto-flow')), el.getAttribute('data-goto-anom'));
      });
    });
    container.querySelectorAll('[data-open-port]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        ev.preventDefault();
        const [dId, pName] = el.getAttribute('data-open-port').split('|');
        nav.openDevice(dId, pName);
      });
    });
    container.querySelector('#matrix-dev-filter')?.addEventListener('change', (e) => {
      appState.vlanMatrixDevice = e.target.value;
      renderVlans(container);
    });
    container.querySelector('#matrix-anom-toggle')?.addEventListener('click', () => {
      appState.vlanMatrixOnlyAnom = !appState.vlanMatrixOnlyAnom;
      renderVlans(container);
    });
  }

  /* ==================== SCREEN 5: CLIENTS ==================== */
  function renderClients(container) {
    const q = appState.clientQuery.trim().toLowerCase();
    const filtered = D.CLIENTS.filter((c) => {
      if (appState.clientType !== 'all' && c.connection_type !== appState.clientType) return false;
      if (appState.clientVlan !== 'all' && String(c.vlan) !== String(appState.clientVlan)) return false;
      if (!q) return true;
      const dev = D.getDevice(c.attached_device_id);
      return [c.hostname, c.mac, c.ips.join(' '), c.ssid || '', c.vendor_oui || '', dev?.name || ''].join(' ').toLowerCase().includes(q);
    });

    container.innerHTML = `
      <div class="page-header">
        <div>
          <h2 class="page-title">Clients</h2>
          <p class="page-subtitle">Cross-vendor observed endpoints correlated from FDB, ARP/NDP, DHCP leases, and wireless associations.</p>
        </div>
        <div class="page-actions">
          <input id="cl-search" class="input" type="search" placeholder="Search hostname, IP, MAC, SSID..." value="${appState.clientQuery}" style="width:230px" />
          <select id="cl-vlan" class="select">
            <option value="all">All VLANs</option>
            ${D.VLANS.map((v) => `<option value="${v.id}" ${String(appState.clientVlan) === String(v.id) ? 'selected' : ''}>VLAN ${v.id} · ${v.name}</option>`).join('')}
          </select>
          <div class="segmented">
            <button class="${appState.clientType === 'all' ? 'active' : ''}" data-cl-type="all">All</button>
            <button class="${appState.clientType === 'wired' ? 'active' : ''}" data-cl-type="wired">Wired</button>
            <button class="${appState.clientType === 'wireless' ? 'active' : ''}" data-cl-type="wireless">Wi-Fi</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Hostname</th><th>MAC / Vendor</th><th>IP Addresses</th><th>VLAN</th><th>Attachment</th><th>Signal / Link</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${filtered.map((c) => {
                const dev = D.getDevice(c.attached_device_id);
                return `
                  <tr>
                    <td class="fw-600">${c.hostname}</td>
                    <td><div class="mono text-xs">${c.mac}</div><div class="text-xs dimmed">${c.vendor_oui || ''}</div></td>
                    <td class="mono text-xs">${c.ips.length ? c.ips.join('<br>') : '<span class="dimmed">Unassigned</span>'}</td>
                    <td>${vlanChip(c.vlan)}</td>
                    <td>
                      <a href="#device/${encodeURIComponent(dev.id)}" data-open-port="${dev.id}|${c.attached_link || ''}">${dev.name}</a>
                      <span class="mono text-xs dimmed">(${c.ssid ? c.ssid : c.attached_link})</span>
                    </td>
                    <td class="mono text-xs">${c.connection_type === 'wireless' ? `${c.signal_dbm} dBm · ${c.tx_rate_mbps}M` : 'Wired'}</td>
                    <td>${c.note ? `<button class="badge badge-amber" style="cursor:pointer" data-goto-flow="${c.vlan}">⊘ ${c.note}</button>` : '<span class="badge badge-green">Online</span>'}</td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const input = container.querySelector('#cl-search');
    if (input) {
      input.addEventListener('input', () => {
        appState.clientQuery = input.value;
        renderClients(container);
        const refocus = container.querySelector('#cl-search');
        if (refocus) { refocus.focus(); refocus.setSelectionRange(refocus.value.length, refocus.value.length); }
      });
    }
    container.querySelector('#cl-vlan')?.addEventListener('change', (e) => { appState.clientVlan = e.target.value; renderClients(container); });
    container.querySelectorAll('[data-cl-type]').forEach((btn) => btn.addEventListener('click', () => { appState.clientType = btn.getAttribute('data-cl-type'); renderClients(container); }));
    container.querySelectorAll('[data-open-port]').forEach((el) => el.addEventListener('click', (e) => {
      e.preventDefault();
      const [dId, port] = el.getAttribute('data-open-port').split('|');
      nav.openDevice(dId, port || null);
    }));
    container.querySelectorAll('[data-goto-flow]').forEach((el) => el.addEventListener('click', () => nav.openVlanFlow(Number(el.getAttribute('data-goto-flow')))));
  }

  /* ==================== ROUTER & SHELL ==================== */
  function updateSidebarActive() {
    const route = appState.route === 'device-detail' ? 'devices' : appState.route;
    document.querySelectorAll('.nav-item[data-route]').forEach((btn) => {
      const active = btn.getAttribute('data-route') === route;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-current', active ? 'page' : 'false');
    });
  }

  function render() {
    updateSidebarActive();
    const main = document.getElementById('main-view');
    if (!main) return;

    switch (appState.route) {
      case 'overview':
        renderOverview(main);
        break;
      case 'topology':
        global.NETPLANE_TOPOLOGY.render(main, nav);
        break;
      case 'vlan-flow':
        global.NETPLANE_VLAN_FLOW.render(main, nav);
        break;
      case 'devices':
        renderDevicesList(main);
        break;
      case 'device-detail':
        renderDeviceDetail(main);
        break;
      case 'vlans':
        renderVlans(main);
        break;
      case 'clients':
        renderClients(main);
        break;
      default:
        renderOverview(main);
    }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('netplane-proto-theme', theme); } catch (_) {}
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
    // Re-render SVG canvases so theme colors update immediately
    if (appState.route === 'topology' || appState.route === 'vlan-flow') render();
  }

  function parseHash() {
    const raw = (window.location.hash || '#overview').replace(/^#/, '');
    if (raw.startsWith('device/')) {
      appState.route = 'device-detail';
      appState.deviceId = decodeURIComponent(raw.slice('device/'.length));
    } else if (raw.startsWith('vlan-flow/')) {
      appState.route = 'vlan-flow';
      const sub = raw.slice('vlan-flow/'.length);
      if (sub === 'all') global.NETPLANE_VLAN_FLOW.setMode('all');
      else global.NETPLANE_VLAN_FLOW.setFocus(Number(sub), null);
    } else if (['overview', 'topology', 'vlan-flow', 'devices', 'vlans', 'clients'].includes(raw)) {
      appState.route = raw;
    } else {
      appState.route = 'overview';
    }
  }

  function init() {
    // Initialize theme from saved preference or OS color scheme (matches Andaru defaultColorScheme="auto")
    let initialTheme = 'light';
    try {
      const saved = localStorage.getItem('netplane-proto-theme');
      if (saved === 'light' || saved === 'dark') initialTheme = saved;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initialTheme = 'dark';
    } catch (_) {}
    applyTheme(initialTheme);

    // Update anomaly counters in header & sidebar
    const anomCount = D.anomalies.length;
    const navBadge = document.getElementById('nav-flow-badge');
    if (navBadge) navBadge.textContent = String(anomCount);
    const hdrBadge = document.getElementById('header-anom-btn');
    if (hdrBadge) {
      hdrBadge.textContent = `⚠ ${anomCount} VLAN issues`;
      hdrBadge.addEventListener('click', () => nav.go('vlan-flow'));
    }

    // Wire sidebar nav
    document.querySelectorAll('.nav-item[data-route]').forEach((btn) => {
      btn.addEventListener('click', () => nav.go(btn.getAttribute('data-route')));
    });

    // Mobile drawer
    const burger = document.getElementById('burger-btn');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('nav-backdrop');
    burger?.addEventListener('click', () => {
      sidebar?.classList.toggle('open');
      backdrop?.classList.toggle('open');
    });
    backdrop?.addEventListener('click', closeMobileNav);

    // Theme toggle
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });

    // Simulated Poll All
    document.getElementById('poll-btn')?.addEventListener('click', () => {
      showToast('Polled 4 targets (andaru, openwrt, rtlplayground, unifi) — 6/6 online');
    });

    window.addEventListener('hashchange', () => { parseHash(); render(); });
    parseHash();
    render();
  }

  document.addEventListener('DOMContentLoaded', init);
})(window);

  </script>
</body>
</html>
