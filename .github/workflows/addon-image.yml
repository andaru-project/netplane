# SPDX-License-Identifier: AGPL-3.0-or-later
name: Add-on image

# Publishes the multi-arch image ghcr.io/<owner>/netplane:<version> (linux/amd64, linux/arm64)
# for Home Assistant, which pulls the image named in ha-addon/config.yaml at the tag equal to
# its `version`, and for standalone `docker run`. Pull requests
# build both images without pushing: the image depends on the whole tree.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the add-on version and check it matches the tag
        run: |
          version=$(yq -r '.version // ""' ha-addon/config.yaml)
          test -n "$version" || { echo "no version in ha-addon/config.yaml"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ha-addon/config.yaml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ needs.version.outputs.owner }}/netplane:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
