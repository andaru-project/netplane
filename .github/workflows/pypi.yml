# SPDX-License-Identifier: AGPL-3.0-or-later
name: PyPI

# Publishes clients/python to PyPI as netplane-client for every client-v<version> tag on a
# commit already on main, through PyPI trusted publishing (no token: PyPI trusts this workflow
# in the "pypi" environment). A PyPI version can never be uploaded again, so the tag is tested
# and checked against the package version first.
# Pull requests that touch the client build it without publishing.
on:
  push:
    tags: ["client-v*"]
  pull_request:
    paths: ["clients/python/**", ".github/workflows/pypi.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("clients/python/pyproject.toml","rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "client-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match clients/python version ${version}"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo "tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
      - name: Build the sdist and wheel
        run: |
          python3 -m pip install --quiet build==1.6.1
          python3 -m build clients/python --outdir dist
      # Test the wheel that gets published, not the source tree.
      - name: Test the built wheel
        run: |
          python3 -m pip install --quiet dist/*.whl
          python3 -m unittest discover -s clients/python/tests -t clients/python/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
