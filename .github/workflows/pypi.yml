# SPDX-License-Identifier: Apache-2.0
name: PyPI

# Publishes clients/python to PyPI as netplane-client for every client-v<version> tag, through
# PyPI trusted publishing (no token: PyPI trusts this workflow in the "pypi" environment).
# Pull requests that touch the client build it without publishing.
on:
  push:
    tags: ["client-v*"]
  pull_request:
    paths: ["clients/python/**", ".github/workflows/pypi.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("clients/python/pyproject.toml","rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "client-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match clients/python version ${version}"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build clients/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
