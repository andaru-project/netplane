# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netplane-client"
version = "0.1.0"
description = "Async Python client for the Andaru Netplane HTTP/SSE wire API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/andaru-project/netplane"
Issues = "https://github.com/andaru-project/netplane/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
